# main 의 package.json 판이 아직 릴리스되지 않은 판이면 빌드해서 두 곳에 올린다.
#  ① release 브랜치: 플러그인이 받는 파일(시작기·본체 조각·자료 팩·카드 업데이트·사진). 매번 새로 덮어써서 옛 조각이 쌓이지 않는다.
#     플러그인이 받는 주소 = https://raw.githubusercontent.com/leepc25/goei/release (package.json goei.updateBase)
#  ② Releases: 처음 설치용 플러그인·카드, 받지 못할 때 넣는 본체·세계 자료.
# GitHub는 릴리스 파일 이름의 한글을 지우므로 파일 이름은 영문, 화면에 보이는 이름(라벨)은 한글로 둔다.
name: release
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 판 확인
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && gh release view "$tag" >/dev/null 2>&1; then
            echo "이미 릴리스된 판 ($tag): 건너뜀"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
          # main 에 올라온 것만으로는 릴리스하지 않는다: 판 번호가 바뀐 push 만 (릴리스는 사용자가 「릴리스해」라고 할 때 판을 올려 합친다)
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            git fetch --depth=1 origin "$before" >/dev/null 2>&1 || true
            prev=$(git show "$before:package.json" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})")
            if [ -z "$prev" ] || [ "v$prev" = "$tag" ]; then
              echo "판 번호가 바뀌지 않음 (앞: ${prev:-없음}, 지금: $tag): 건너뜀"
              echo "skip=1" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != '1'
        with:
          node-version: 22
      - if: steps.v.outputs.skip != '1'
        run: npm ci
      # 시험이 실패하면 여기서 멈춰 release 브랜치·Releases 에 올리지 않는다 (2026-11-15 사용자: GitHub 릴리스에 시험을 넣는다)
      - name: '빌드·시험 (npm run release:prep 과 같은 순서: 빌드 → 카드 → 빌드 → release/ 로 복사 → 형 검사·단위 시험)'
        if: steps.v.outputs.skip != '1'
        run: node scripts/release-prep.mjs --no-fixture
      - name: release 브랜치에 올리기
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          rm -rf site && mkdir site && cp -r release/. site/ && rm -f site/*.charx
          cd site
          git init -q -b release
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "$TAG"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release
      - name: 묶기
        if: steps.v.outputs.skip != '1'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          rm -rf out && mkdir -p out
          cp dist/goei-plugin.js dist/goei-body.js dist/goei-data-world.txt out/
          cp release/괴이_ANOMALY.charx out/goei-anomaly.charx
      - name: 릴리스
        if: steps.v.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          files=("out/goei-plugin.js#플러그인 (goei-plugin.js)" "out/goei-anomaly.charx#봇 카드 (goei-anomaly.charx)" "out/goei-body.js#본체 (goei-body.js, 자동으로 받지 못할 때만)" "out/goei-data-world.txt#세계 자료 (goei-data-world.txt, 자동으로 받지 못할 때만)")
          {
            echo '## 설치'
            echo '1. 아래 Assets 에서 「플러그인」과 「봇 카드」를 받습니다.'
            echo '2. 리스AI 설정 → 플러그인에서 `goei-plugin.js` 를 추가합니다. 권한을 묻는 창이 뜨면 모두 허용합니다.'
            echo '3. `goei-anomaly.charx` 를 캐릭터로 가져옵니다.'
            echo '4. 괴이 카드를 열면 나머지 파일을 자동으로 받습니다.'
            echo '5. 화면 구석의 유령 단추를 누르면 시작 화면이 열립니다.'
            echo
            echo '## 업데이트'
            echo '- 플러그인: 리스AI 설정 → 플러그인 탭에서 괴이 플러그인의 업데이트를 누릅니다.'
            echo '- 봇 카드: 유령 단추 → 설정 → 점검 → 설치·업데이트에서 「카드 업데이트 준비」와 「카드에 적용」을 차례로 누릅니다.'
            echo
            echo '## 자동으로 받지 못할 때'
            echo '괴이 카드를 열었을 때 「받지 못했어요」 창이 뜨면 먼저 「다시 받기」를 누릅니다. 그래도 받지 못하면 아래 Assets 에서 「본체」와 「세계 자료」를 받아 「파일로 넣기」로 차례로 넣습니다.'
          } > out/notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            for a in $(gh release view "$TAG" --json assets -q '.assets[].name'); do gh release delete-asset "$TAG" "$a" -y; done
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file out/notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" "${files[@]}" \
              --title "괴이 ː ANOMALY ${TAG}" --prerelease \
              --notes-file out/notes.md
          fi
